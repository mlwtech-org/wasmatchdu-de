name: Update Channels JSON

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_PAT }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Run aggregation script
      run: node scripts/aggregate_channels.js

    - name: Check for changes
      id: git-check
      run: |
        git diff --exit-code public/channels.json || echo "changes=true" >> $GITHUB_OUTPUT

    - name: Commit and push to data branch
      if: steps.git-check.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git fetch origin data || true
        git checkout data 2>/dev/null || git checkout --orphan data
        git checkout main -- public/channels.json
        git add public/channels.json
        git commit -m "chore: auto-update channels.json feed" --no-verify || true
        git push origin data
