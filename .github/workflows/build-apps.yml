name: Build and Release Apps

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Web App & Electron Exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx vite build && npx electron-builder --publish never
        
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JanataTv-Windows
          path: release/JanataTv-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Web App
        run: npm run build
        
      - name: Capacitor Sync
        run: npx cap sync android
        
      - name: Build APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        
      - name: Rename APK
        working-directory: ./android/app/build/outputs/apk/debug
        run: mv app-debug.apk JanataTv.apk
        
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JanataTv-Android
          path: android/app/build/outputs/apk/debug/JanataTv.apk

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: JanataTv-Windows
          
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: JanataTv-Android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            JanataTv-Setup.exe
            JanataTv.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
