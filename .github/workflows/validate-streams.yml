name: Automated Stream Validation for Premium Tier

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  validate-streams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Validation Script
        run: node scripts/validate_streams.js

      - name: Commit Updated Streams
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add verified_streams.json
          git commit -m "chore: auto-update verified streams [skip ci]" || echo "No changes to commit"
          git push
